name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tshirt
          POSTGRES_PASSWORD: tshirt
          POSTGRES_DB: tshirt_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tshirt -d tshirt_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tshirt:tshirt@127.0.0.1:5433/tshirt_db?schema=public
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:deploy -w @tshirt/api

      - name: Generate Prisma client
        run: npm run db:generate -w @tshirt/api

      - run: npm run lint

      - run: npm run test

      - run: npm run build
