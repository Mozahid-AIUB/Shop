name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tshirt
          POSTGRES_PASSWORD: tshirt
          POSTGRES_DB: tshirt_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tshirt -d tshirt_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tshirt:tshirt@127.0.0.1:5433/tshirt_db?schema=public
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      # TokenService ডিফল্ট secret রাখে না — না পেলে throw করে, আর তখন
      # login 500 দেয় আর DB ব্যবহার করা প্রতিটা suite ভেঙে পড়ে।
      # এটা throwaway CI মান; আসল secret কখনো এখানে লেখা হবে না।
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      # কুরিয়ারের key এনক্রিপ্ট করার চাবি (Phase 10)। ছাড়া dev fallback
      # দিয়ে চলত, কিন্তু তখন production-এর আচরণটা পরীক্ষাই হতো না —
      # আর পরে NODE_ENV=production যোগ করলে CI হঠাৎ ভাঙত।
      # throwaway মান; আসল চাবি কখনো এখানে লেখা হবে না।
      COURIER_SECRET_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:deploy -w @shop/api

      - name: Generate Prisma client
        run: npm run db:generate -w @shop/api

      # api আর web দুটোই `@shop/shared`-এর dist থেকে টাইপ পড়ে, আর dist
      # কমিট করা হয় না। fresh checkout-এ এটা না চালালে প্রতিটা suite
      # "Cannot find module '@shop/shared'" দিয়ে ভাঙে।
      - name: Build shared package
        run: npm run build -w @shop/shared

      - run: npm run lint

      # `test:cov` টেস্টও চালায়, সাথে coverage-এর সীমাও যাচাই করে।
      # দুটো আলাদা step রাখলে একই suite দুবার চলত।
      # সীমা নিচে নামলে এখানেই ভাঙবে — `apps/api/package.json`-এ
      # `coverageThreshold` দেখো।
      - name: Test with coverage thresholds
        run: npm run test:cov -w @shop/api

      # web-এর নিজের টেস্ট আলাদা (api-র jest config ওগুলো ধরে না)।
      # `test:web` ব্যবহার করতে হয়, `-w @shop/web` নয় — Windows-এ
      # drive letter-এর কারণে vitest সরাসরি চালালে ভাঙে
      # (দেখো: `scripts/run-web-tests.mjs`)
      - run: npm run test:web

      - run: npm run build
